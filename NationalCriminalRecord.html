<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>National Criminal Record by Muhammad Mustaqeem</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  height: 100vh;
  background: url('hy.webp') no-repeat center center/cover;
  background-color: rgb(200, 200, 200);
}
.div-display {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}
.Parent-div {
  margin: 80px auto;
  min-height: 500px;
  width: 60%;
  display: flex;
  justify-content: center;
  box-shadow: 20px 20px 50px rgba(0, 0, 0, 0.5);
  border-radius: 12px;
  background: rgba(184, 38, 38, 0.1);
  backdrop-filter: blur(4px);
  flex-wrap: wrap;
  padding: 20px;
}
.header-div {
  display: flex;
  height: 100px;
  width: 90%;
}
.logo-div {
  height: 90px;
  width: 20%;
}
.logo-img-tag {
  display: block;
  height: 120px;
  margin: 0 auto;
  margin-top: 5px;
}
.heading-div {
  height: 90px;
  width: 55%;
}
.heading-div h1 {
  color: red;
  font-size: 37px;
  font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
}
.main-div {
  display: flex;
  height: 300px;
  width: 90%;
}
.detail-div {
  height: 280px;
  width: 60%;
}
.form_input {
  display: block;
  margin: 5% auto;
  width: 80%;
  outline: none;
  border: none;
  background: none;
  border-bottom: 3px solid #fff;
  padding: 5px;
  color: #000;
  font-weight: bold;
}
button {
  background: #fff;
  border: none;
  border-radius: 5px;
  font-weight: 600;
  font-size: 20px;
  color: #333;
  width: 120px;
  height: 40px;
  transition: 0.3s;
  display: block;
  margin: 5% auto;
  cursor: pointer;
}
button:hover {
  opacity: 0.7;
}
.image-div {
  height: 280px;
  width: 40%;
  position: relative;
}
#searching_record {
  display: none; 
  font-weight: bold; 
  color: yellow;
}
#user_image {
  height: 200px;
  width: 200px;
  display: none;
}
#form_input_error {
  color: red;
  font-weight: 800;
  border: none;
}
</style>
</head>
<body>

  <div class="Parent-div div-display">
    <div class="header-div">
      <div class="logo-div">
        <img class="logo-img-tag" src="poolice.png" alt="Sindh Police Logo">
      </div>
      <div class="heading-div div-display">
        <h1>National Criminal Record</h1>
      </div>
    </div>

    <div class="main-div">
      <div class="detail-div">
        <input class="form_input" type="text" id="UserIdNumber" placeholder="National ID Number">
        <button type="button" onclick="fetching()">Verify</button>
        <p class="form_input" id="form_input-First"></p>
        <p class="form_input" id="form_input-last"></p>
        <p class="form_input" id="form_input_error"></p>
      </div>
      <div class="image-div div-display">
        <div id="user_image"><img src="download..png" alt=""></div>
        <div id="searching_record">Record Searching...</div>
      </div>
    </div>
    <div class="footer-div"></div>
  </div>

<script>
async function fetching() {
    let IdNumber = document.getElementById("UserIdNumber").value.trim();

    // Pehle purana status aur messages clear karein
    document.getElementById("form_input_error").innerText = "";
    document.getElementById("form_input-First").innerText = "";
    document.getElementById("form_input-last").innerText = "";
    document.getElementById("user_image").innerHTML = "";

    if (IdNumber === "") {
        alert("Please enter National ID Number");
        return;
    }

    document.getElementById("searching_record").style.display = "block";
    document.getElementById("user_image").style.display = "block";

    // Aapka complete record data jo isi function ke andar joint hai
    const data = {
        record: {
            "4200": {
                "name": "Muhammad",
                "last": "Waqas",
                "status": "Cleared",
                "image": "https://i.postimg.cc/3xntzPXh/hy.avif"
            },
            "4201": {
                "name": "Muhammad",
                "last": "Usman",
                "status": "Suspected",
                "image": "https://i.postimg.cc/4drLBVzZ/jy.jpg"
            },
            "4202": {
                "name": "Muhammad",
                "last": "Waseem",
                "status": "fraud",
                "image": "https://i.postimg.cc/QdGz9Bg9/hyby.jpg"
            },
              "4203": {
                "name": "Muhammad",
                "last": "wajid",
                "status": "Suspected",
                "image": "https://i.postimg.cc/d1xHqDt2/hyhyhy.jpg"
            },
              "4204": {
                "name": "Muhammad",
                "last": "Shayan",
                "status": "Cleared",
                "image": "https://i.postimg.cc/3ry72vpK/bybyby.jpg"
            },
              "4205": {
                "name": "Muhammad",
                "last": "Bilal",
                "status": "Suspected",
                "image": "https://i.postimg.cc/bvNfrDpY/byby.avif"
            },
              "4206": {
                "name": "Muhammad",
                "last": "Arsam",
                "status": "Suspected",
                "image": "https://i.postimg.cc/fTn4XgDm/hyhy.jpg"
            },
         
        }
    };

    try {
        if (data.record[IdNumber]) {
            let userName = data.record[IdNumber].name;
            let userLast = data.record[IdNumber].last;
            let userPhoto = data.record[IdNumber].image;
            let userStatus = data.record[IdNumber].status;

            document.getElementById("form_input-First").innerText = "First Name: " + userName.toUpperCase();
            document.getElementById("form_input-last").innerText = "Last Name: " + userLast.toUpperCase();

            if (userStatus === "Suspected") {
                document.getElementById("user_image").innerHTML = `
                <div style="position:relative; width:200px; height:200px; margin:0 auto;">
                    <img src="${userPhoto}" width="200" height="200" alt="User Image" style="object-fit:cover; background:black; border-radius:8px;">
                    <img src="image-sucpected.png"
                         style="
                         position:absolute;
                         bottom:15px;
                         left:15px;
                         width:150px;
                         opacity:0.8;" alt="Stamp">
                </div>
                `;
            } else {
                document.getElementById("user_image").innerHTML = `
                <img src="${userPhoto}"
                     width="200"
                     height="200"
                     alt="User Image"
                     style="object-fit:cover; background:black; border-radius:8px; margin:0 auto; display:block;">
                `;
            }
        } else {
            document.getElementById("form_input_error").innerText = "Required details not found";
            document.getElementById("user_image").style.display = "none";
        }
    } catch (error) {
        document.getElementById("form_input_error").innerText = error.message;
    } finally {
        document.getElementById("searching_record").style.display = "none";
    }
}
</script>
</body>
</html>
